apiVersion: v1
kind: Namespace
metadata:
  name: openupf
---
apiVersion: v1
kind: Service
metadata:
  name: openupf-smu
  namespace: openupf
spec:
  selector:
    app: openupf-smu
  ports:
  - name: rest
    port: 38080
    targetPort: 38080
  - name: fpu-mgmt
    port: 50000
    targetPort: 50000
---
apiVersion: v1
kind: Service
metadata:
  name: openupf-lbu
  namespace: openupf
spec:
  selector:
    app: openupf-lbu
  ports:
  - name: backend-mgmt
    port: 34434
    targetPort: 34434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openupf-smu
  namespace: openupf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openupf-smu
  template:
    metadata:
      labels:
        app: openupf-smu
    spec:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-01
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
      - name: ghcr-openupf
      containers:
      - name: smu
        image: ghcr.io/infinitydon/openupf:codex-openupf-cluster-bringup
        imagePullPolicy: IfNotPresent
        command: ["/opt/upf/script/kubernetes-entrypoint.sh", "smu"]
        env:
        - name: UPF_RUNCONFIG
          value: /opt/upf/config/smu/smu_docker.ini
        ports:
        - containerPort: 38080
          name: rest
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 2Gi
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        volumeMounts:
        - name: config
          mountPath: /opt/upf/config/smu/smu_docker.ini
          subPath: smu_docker.ini
      volumes:
      - name: config
        configMap:
          name: openupf-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openupf-fpu
  namespace: openupf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openupf-fpu
  template:
    metadata:
      labels:
        app: openupf-fpu
    spec:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-01
      imagePullSecrets:
      - name: ghcr-openupf
      containers:
      - name: fpu
        image: ghcr.io/infinitydon/openupf:codex-openupf-cluster-bringup
        imagePullPolicy: IfNotPresent
        command: ["/opt/upf/script/kubernetes-entrypoint.sh", "fpu"]
        resources:
          requests:
            cpu: "2"
            memory: 512Mi
            hugepages-1Gi: 1Gi
            deviceclass.resource.kubernetes.io/linux-net-dpdk-intel-vf: "1"
          limits:
            cpu: "2"
            memory: 512Mi
            hugepages-1Gi: 1Gi
            deviceclass.resource.kubernetes.io/linux-net-dpdk-intel-vf: "1"
        securityContext:
          capabilities:
            add: ["IPC_LOCK", "SYS_ADMIN", "SYS_RAWIO"]
        volumeMounts:
        - name: hugepages
          mountPath: /dev/hugepages
        - name: config
          mountPath: /opt/upf/config/fpu/fpu_dpdk_docker.ini
          subPath: fpu_dpdk_docker.ini
      volumes:
      - name: hugepages
        emptyDir:
          medium: HugePages
      - name: config
        configMap:
          name: openupf-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openupf-lbu
  namespace: openupf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openupf-lbu
  template:
    metadata:
      labels:
        app: openupf-lbu
    spec:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-01
      imagePullSecrets:
      - name: ghcr-openupf
      containers:
      - name: lbu
        image: ghcr.io/infinitydon/openupf:codex-openupf-cluster-bringup
        imagePullPolicy: IfNotPresent
        command: ["/opt/upf/script/kubernetes-entrypoint.sh", "lbu"]
        resources:
          requests:
            cpu: "3"
            memory: 768Mi
            hugepages-1Gi: 2Gi
            deviceclass.resource.kubernetes.io/linux-net-dpdk-intel-vf: "2"
          limits:
            cpu: "3"
            memory: 768Mi
            hugepages-1Gi: 2Gi
            deviceclass.resource.kubernetes.io/linux-net-dpdk-intel-vf: "2"
        securityContext:
          capabilities:
            add: ["IPC_LOCK", "SYS_ADMIN", "SYS_RAWIO"]
        volumeMounts:
        - name: hugepages
          mountPath: /dev/hugepages
        - name: config
          mountPath: /opt/upf/config/lbu/lbu_docker.ini
          subPath: lbu_docker.ini
      volumes:
      - name: hugepages
        emptyDir:
          medium: HugePages
      - name: config
        configMap:
          name: openupf-config
